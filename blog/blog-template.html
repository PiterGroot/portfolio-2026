<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Placeholders (each is used in several places, so one find-and-replace fills them all):
          {{TITLE}}        Article title
          {{DESCRIPTION}}  One or two sentences; escape any " as &quot;
          {{URL}}          Full absolute URL of this post
          {{IMAGE}}        Full absolute URL of the preview image (ideally 1200x630)
          {{DATE}}         Publish date as YYYY-MM-DD
          {{DATE_HUMAN}}   Publish date as shown to readers, e.g. January 7, 2026
    -->

    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="author" content="Piter Groot">
    <link rel="canonical" href="{{URL}}">

    <!-- Link previews (Discord, Slack, LinkedIn, iMessage, X falls back to these too) -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Piter Groot">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{URL}}">
    <meta property="og:image" content="{{IMAGE}}">
    <meta property="article:published_time" content="{{DATE}}">

    <!-- Only tag X needs on top of Open Graph: large image card instead of small thumbnail -->
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="../style/styles.css">
    <link rel="stylesheet" href="../style/blog-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css">

    <!-- defer: download in parallel, run in order after the HTML is parsed -->
    <script defer src="../js/particles.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/smooth-scroll.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>

<body>
    <div id="particles-js"></div>

    <div class="blog-post-container">
        <a href="../index.html" class="back-link">← Back</a>
        <article>
            <header class="blog-post-header">
                <h1 class="blog-post-title">{{TITLE}}</h1>
                <div class="blog-post-meta">
                    Published on <time datetime="{{DATE}}">{{DATE_HUMAN}}</time>
                </div>
            </header>

            <div class="blog-post-content">
                <p>
                    Intro.
                </p>

                <h2>Section heading</h2>
                <p>
                    Section body.
                </p>

                <pre><code class="language-cpp">// Code blocks: set the language class and the autoloader fetches it
int main() { return 0; }</code></pre>
            </div>
        </article>
    </div>
</body>

</html>
